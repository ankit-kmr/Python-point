    default: true
    workspace:
      host: https://dbc-94ebebef-b3da.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-94ebebef-b3da.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ankit.dev2996@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ankit.dev2996@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ankit.dev2996@gmail.com
        level: CAN_MANAGE
